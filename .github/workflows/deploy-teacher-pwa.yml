name: Deploy teacher PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ZeugnisManager.Teacher/**"
      - "ZeugnisManager.Core/**"
      - ".github/workflows/deploy-teacher-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set GitHub Pages base path
        run: sed -i 's#<base href="/" />#<base href="/IKO.ZeugnisManager.Ipad/" />#' ZeugnisManager.Teacher/wwwroot/index.html

      - name: Publish teacher PWA
        run: dotnet publish ZeugnisManager.Teacher/ZeugnisManager.Teacher.csproj --configuration Release --output publish

      - name: Add GitHub Pages fallback
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
